name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "pacac-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pacac.exe" "$name/"
          Copy-Item config.yaml, README.md, LICENSE "$name/"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          name="pacac-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/pacac" "$name/"
          cp config.yaml README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pacac-${{ matrix.target }}.zip
            pacac-${{ matrix.target }}.tar.gz
          fail_on_unmatched_files: false
